pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // FORCE GRADLE TO RECOGNIZE THE KOTLIN PLUGIN
        id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "TrispyBox"
include ':app'

// Point directly to the app module inside the BlackBox folder
include ':BlackBox'
project(':BlackBox').projectDir = new File(settingsDir, 'BlackBox/app')
