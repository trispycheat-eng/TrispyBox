pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
    }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "TrispyBox"
include ':app'

// Include ALL THREE BlackBox modules
include ':Bcore'
project(':Bcore').projectDir = new File(settingsDir, 'BlackBox/Bcore')

include ':black-reflection'
project(':black-reflection').projectDir = new File(settingsDir, 'BlackBox/black-reflection')
