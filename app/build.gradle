plugins {
    id 'com.android.application'
}

android {
    namespace 'com.android.system.service'
    compileSdk 34

    defaultConfig {
        applicationId "com.android.system.service"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // LOCAL PROJECT LINK
    implementation project(':BlackBox')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
