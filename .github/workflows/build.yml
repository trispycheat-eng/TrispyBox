name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Force Folder Structure
      run: |
        echo "Extracting and enforcing BlackBox/app structure..."
        mkdir -p BlackBox_tmp
        unzip -q BlackBox.zip -d BlackBox_tmp
        
        mkdir -p BlackBox/app
        
        # Check if the zip extracted an 'app' folder directly
        if [ -d "BlackBox_tmp/app" ]; then
            mv BlackBox_tmp/* BlackBox/
        # Check if there's a nested folder like 'BlackBox-2.1.0/app'
        elif [ -d "BlackBox_tmp/BlackBox-2.1.0/app" ]; then
            mv BlackBox_tmp/BlackBox-2.1.0/* BlackBox/
        # Otherwise, assume everything is the module and move it to app/
        else
            mv BlackBox_tmp/* BlackBox/app/
        fi
        rm -rf BlackBox_tmp

    - name: Patch BlackBox Module Gradle (Python)
      run: |
        python3 - << 'EOF'
        import os
        import re

        # The actual module is inside the app folder
        module_gradle = 'BlackBox/app/build.gradle'
        
        if not os.path.exists(module_gradle):
            print("ERROR: Could not find BlackBox/app/build.gradle")
            exit(1)

        with open(module_gradle, 'r') as f:
            content = f.read()

        # 1. Change from Application to Library
        content = content.replace("com.android.application", "com.android.library")
        
        # 2. Remove applicationId
        content = re.sub(r'applicationId\s*["\'][^"\']+["\']', '', content)
        
        # 3. Fix dead jcenter
        content = content.replace('jcenter()', 'mavenCentral()')
        
        # 4. Fix SDK variables safely
        content = re.sub(r'compileSdkVersion\s*[=\s]\s*\d+', 'compileSdkVersion 34', content)
        content = re.sub(r'minSdkVersion\s*[=\s]\s*\d+', 'minSdkVersion 26', content)
        content = re.sub(r'targetSdkVersion\s*[=\s]\s*\d+', 'targetSdkVersion 34', content)

        # 5. Add namespace if missing
        if 'namespace ' not in content:
            content = content.replace('android {', 'android {\n    namespace "top.niunaijun.blackbox"')

        with open(module_gradle, 'w') as f:
            f.write(content)

        print("Patched BlackBox/app/build.gradle successfully.")
        EOF

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
