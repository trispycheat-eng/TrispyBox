name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Flatten BlackBox Engine
      run: |
        echo "Extracting BlackBox..."
        unzip -q BlackBox.zip -d temp_extract
        if [ -f "temp_extract/build.gradle" ]; then
           mv temp_extract BlackBox
        else
           mv temp_extract/* BlackBox
           rm -rf temp_extract
        fi

    - name: Patch BlackBox Gradle Files
      run: |
        echo "Patching BlackBox repositories..."
        # ONLY replace jcenter. Do NOT delete brackets.
        sed -i 's/jcenter()/mavenCentral()/g' BlackBox/build.gradle
        
        # Force SDK versions
        sed -i 's/compileSdkVersion [0-9]*/compileSdk 34/g' BlackBox/build.gradle || true
        sed -i 's/targetSdkVersion [0-9]*/targetSdk 34/g' BlackBox/build.gradle || true
        sed -i 's/minSdkVersion [0-9]*/minSdk 26/g' BlackBox/build.gradle || true
        
        echo "--- Patched BlackBox build.gradle ---"
        cat BlackBox/build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Generate Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Build with Gradle
      run: |
        echo "Building..."
        set +e
        ./gradlew assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
