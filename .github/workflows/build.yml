name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Force Folder Structure
      run: |
        echo "Extracting..."
        mkdir -p BlackBox_tmp
        unzip -q BlackBox.zip -d BlackBox_tmp
        
        mkdir -p BlackBox
        
        # Safely extract regardless of zip structure
        if [ -d "BlackBox_tmp/app" ]; then
            mv BlackBox_tmp/* BlackBox/
        elif [ -d "BlackBox_tmp/BlackBox-2.1.0/app" ]; then
            mv BlackBox_tmp/BlackBox-2.1.0/* BlackBox/
        else
            mv BlackBox_tmp/* BlackBox/
        fi
        rm -rf BlackBox_tmp

    - name: Generate Settings Gradle & Patch Modules
      run: |
        python3 - << 'EOF'
        import os
        import glob
        import re

        # 1. DYNAMICALLY GENERATE SETTINGS.GRADLE
        modules = []
        for root, dirs, files in os.walk('BlackBox'):
            if 'build.gradle' in files and root != 'BlackBox':
                mod_path = root.replace('BlackBox/', '')
                mod_name = mod_path.replace('/', ':')
                modules.append((mod_name, mod_path))

        with open('settings.gradle', 'w') as f:
            f.write("pluginManagement {\n    repositories {\n        google()\n        mavenCentral()\n        gradlePluginPortal()\n    }\n    plugins {\n        id 'org.jetbrains.kotlin.android' version '1.8.10' apply false\n    }\n}\n")
            f.write("dependencyResolutionManagement {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n")
            f.write("rootProject.name = \"TrispyBox\"\n")
            f.write("include ':app'\n")
            
            for mod_name, mod_path in modules:
                if mod_name == 'app': continue # Skip BlackBox demo app
                f.write(f"include ':{mod_name}'\n")
                f.write(f"project(':{mod_name}').projectDir = new File(settingsDir, 'BlackBox/{mod_path}')\n")
        
        print("Dynamically generated settings.gradle with all modules.")

        # 2. PATCH ALL BUILD.GRADLE FILES
        build_files = glob.glob('BlackBox/**/build.gradle', recursive=True)
        for module_gradle in build_files:
            with open(module_gradle, 'r') as f:
                content = f.read()

            # Force Library
            content = content.replace("com.android.application", "com.android.library")
            
            # Remove applicationId
            content = re.sub(r'applicationId\s*["\'][^"\']+["\']', '', content)
            
            # Fix dead jcenter
            content = content.replace('jcenter()', 'mavenCentral()')
            
            # Fix SDK versions
            content = re.sub(r'compileSdkVersion\s+[^=\n]+', 'compileSdkVersion 34', content)
            content = re.sub(r'minSdkVersion\s+[^=\n]+', 'minSdkVersion 26', content)
            content = re.sub(r'targetSdkVersion\s+[^=\n]+', 'targetSdkVersion 34', content)

            # Fix NDK version (Force runner to use pre-installed NDK)
            content = re.sub(r'ndkVersion\s+["\'][^"\']+["\']', 'ndkVersion "25.1.8937393"', content)

            # Fix BlackReflection dependency
            content = re.sub(r'.*com\.github\.CodingGay\.BlackReflection.*', "implementation project(':black-reflection')", content)
            content = content.replace('rootProject.ext.blackReflection', "project(':black-reflection')")

            # Fix Kotlin Plugin
            content = content.replace("id 'kotlin-android'", "id 'org.jetbrains.kotlin.android'")
            content = content.replace("apply plugin: 'kotlin-android'", "apply plugin: 'org.jetbrains.kotlin.android'")

            # Add Namespace
            if 'namespace ' not in content and 'android {' in content:
                safe_name = os.path.basename(os.path.dirname(module_gradle)).replace('-', '_')
                if safe_name == "BlackBox": safe_name = "core"
                content = content.replace('android {', f'android {{\n    namespace "top.niunaijun.{safe_name}"')

            with open(module_gradle, 'w') as f:
                f.write(content)

        print("All modules patched successfully.")
        EOF

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
