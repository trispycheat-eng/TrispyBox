name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Force Folder Structure
      run: |
        echo "Extracting..."
        mkdir -p BlackBox_tmp
        unzip -q BlackBox.zip -d BlackBox_tmp
        
        mkdir -p BlackBox
        
        if [ -d "BlackBox_tmp/app" ]; then
            mv BlackBox_tmp/* BlackBox/
        elif [ -d "BlackBox_tmp/BlackBox-2.1.0/app" ]; then
            mv BlackBox_tmp/BlackBox-2.1.0/* BlackBox/
        else
            mv BlackBox_tmp/* BlackBox/
        fi
        rm -rf BlackBox_tmp

    - name: Generate Root Build Files (Gradle 7.4.2)
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url 'https://jitpack.io' }
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        rootProject.name = "TrispyBox"
        include ':app'
        include ':Bcore'
        project(':Bcore').projectDir = new File(settingsDir, 'BlackBox/Bcore')
        include ':Bcore:black-fake'
        project(':Bcore:black-fake').projectDir = new File(settingsDir, 'BlackBox/Bcore/black-fake')
        include ':Bcore:black-hook'
        project(':Bcore:black-hook').projectDir = new File(settingsDir, 'BlackBox/Bcore/black-hook')
        include ':Bcore:pine-core'
        project(':Bcore:pine-core').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-core')
        include ':Bcore:pine-xposed'
        project(':Bcore:pine-xposed').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-xposed')
        include ':Bcore:pine-xposed-res'
        project(':Bcore:pine-xposed-res').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-xposed-res')
        EOF

    - name: Patch ALL Modules (Fix Dependencies & Repositories)
      run: |
        python3 - << 'EOF'
        import os
        import glob
        import re

        build_files = glob.glob('BlackBox/**/build.gradle', recursive=True)
        
        for module_gradle in build_files:
            if not os.path.exists(module_gradle): continue
            
            with open(module_gradle, 'r') as f:
                content = f.read()

            # 1. Completely strip out any repositories block (fixes the repository warning)
            content = re.sub(r'repositories\s*\{[\s\S]*?\}', '', content)

            # 2. Force Android Library
            content = content.replace("com.android.application", "com.android.library")
            
            # 3. Remove applicationId
            content = re.sub(r'applicationId\s*["\'][^"\']+["\']', '', content)
            
            # 4. Replace rootProject.ext variables
            content = content.replace('rootProject.ext.compileSdkVersion', '33')
            content = content.replace('rootProject.ext.buildToolsVersion', '"33.0.0"')
            content = content.replace('rootProject.ext.minSdkVersion', '26')
            content = content.replace('rootProject.ext.targetSdkVersion', '33')
            content = content.replace('rootProject.ext.ndkVersion', '"25.1.8937393"')
            content = content.replace('rootProject.ext.androidXCoreVersion', '"1.9.0"')

            # 5. Swap missing local projects for JitPack Maven libraries
            content = content.replace("project(':black-reflection')", "'com.github.CodingGay.BlackReflection:core:1.3.1'")
            content = content.replace("project(':android-mirror')", "'com.github.tiann:FreeReflection:3.1.0'")
            content = content.replace("me.weishu:free_reflection:3.0.1", "com.github.tiann:FreeReflection:3.1.0")

            # 6. Clean up SDK versions
            content = re.sub(r'compileSdkVersion\s+[^=\n]+', 'compileSdkVersion 33', content)
            content = re.sub(r'minSdkVersion\s+[^=\n]+', 'minSdkVersion 26', content)
            content = re.sub(r'targetSdkVersion\s+[^=\n]+', 'targetSdkVersion 33', content)
            content = re.sub(r'buildToolsVersion\s+[^=\n]+', 'buildToolsVersion "33.0.0"', content)

            # 7. Fix Kotlin Plugin
            content = content.replace("id 'kotlin-android'", "id 'org.jetbrains.kotlin.android'")
            content = content.replace("apply plugin: 'kotlin-android'", "apply plugin: 'org.jetbrains.kotlin.android'")

            with open(module_gradle, 'w') as f:
                f.write(content)

        print("Patched successfully. Left AndroidManifests untouched.")
        EOF

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle 7.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.6

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
