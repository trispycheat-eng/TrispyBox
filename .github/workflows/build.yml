name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip BlackBox Engine
      run: |
        echo "Extracting..."
        unzip -q BlackBox.zip -d temp_extract
        if [ -f "temp_extract/build.gradle" ]; then
           mv temp_extract BlackBox
        else
           mv temp_extract/* BlackBox
           rm -rf temp_extract
        fi

    - name: Patch BlackBox Gradle Perfectly
      run: |
        echo "Patching Gradle Scripts..."
        # 1. Fix dead repositories
        sed -i 's/jcenter()/mavenCentral()/g' BlackBox/build.gradle
        
        # 2. Kill the entire old compileSdk line and replace it cleanly
        sed -i 's/.*compileSdkVersion.*/compileSdk 34/' BlackBox/build.gradle
        sed -i 's/.*targetSdkVersion.*/targetSdk 34/' BlackBox/build.gradle
        sed -i 's/.*minSdkVersion.*/minSdk 26/' BlackBox/build.gradle
        
        # 3. Inject namespace (required for Android 14+ builds)
        if ! grep -q "namespace" BlackBox/build.gradle; then
          sed -i 's/android {/android {\n    namespace "top.niunaijun.blackbox"/' BlackBox/build.gradle
        fi
        
        # 4. Show the final result so we can verify
        echo "--- Patched BlackBox/build.gradle ---"
        head -n 40 BlackBox/build.gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    - name: Generate Wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        ./gradlew assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
