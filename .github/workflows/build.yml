name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Get the code
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Set up Java (JDK 17 is required for modern Gradle and Android)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Extract the BlackBox Engine
    - name: Unzip BlackBox Engine
      run: |
        echo "Extracting BlackBox.zip..."
        unzip -q BlackBox.zip -d temp_extract
        mv temp_extract/* BlackBox
        rm -rf temp_extract
        echo "Extraction complete."

    # 4. THE FIX: Auto-patch settings.gradle
    # Gradle 9 throws a fit if project repos are used. We nuke that rule.
    - name: Patch Settings Gradle
      run: |
        echo "Patching settings.gradle to allow project repositories..."
        sed -i '/repositoriesMode.set/d' settings.gradle
        # Ensure mavenCentral is available globally
        if ! grep -q "mavenCentral()" settings.gradle; then
          sed -i 's/google()/google()\n        mavenCentral()/g' settings.gradle
        fi

    # 5. THE FIX: Auto-patch BlackBox Gradle
    # BlackBox is old. It uses deprecated syntax and missing variables.
    - name: Patch BlackBox Gradle Files
      run: |
        echo "Patching BlackBox repositories..."
        # Replace dead jcenter with mavenCentral
        sed -i 's/jcenter()/mavenCentral()/g' BlackBox/build.gradle
        sed -i 's/jcenter()/mavenCentral()/g' build.gradle
        
        # Force compileSdk and targetSdk to 34 if they are missing or old
        if ! grep -q "compileSdk 34" BlackBox/build.gradle; then
          sed -i 's/compileSdkVersion 33/compileSdk 34/g' BlackBox/build.gradle
          sed -i 's/compileSdkVersion 32/compileSdk 34/g' BlackBox/build.gradle
        fi
        
        echo "Cleaning up deprecated Gradle properties..."
        sed -i '/distributionUrl/d' gradle/wrapper/gradle-wrapper.properties || true

    # 6. Set up Gradle (Using a stable version to avoid Gradle 9 bugs)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.7

    # 7. Generate Gradle Wrapper (In case it's missing)
    - name: Generate Wrapper
      run: gradle wrapper --gradle-version 8.7

    # 8. Build the APK
    - name: Build with Gradle
      run: |
        echo "Starting compilation..."
        ./gradlew assembleDebug --stacktrace --warning-mode all

    # 9. Upload the result
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
