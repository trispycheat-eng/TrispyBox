name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Force Folder Structure
      run: |
        echo "Extracting..."
        mkdir -p BlackBox_tmp
        unzip -q BlackBox.zip -d BlackBox_tmp
        
        mkdir -p BlackBox
        
        if [ -d "BlackBox_tmp/app" ]; then
            mv BlackBox_tmp/* BlackBox/
        elif [ -d "BlackBox_tmp/BlackBox-2.1.0/app" ]; then
            mv BlackBox_tmp/BlackBox-2.1.0/* BlackBox/
        else
            mv BlackBox_tmp/* BlackBox/
        fi
        rm -rf BlackBox_tmp

    - name: Generate Root Build Files (Gradle 7.4.2)
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > settings.gradle
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "TrispyBox"
        include ':app'
        include ':Bcore'
        project(':Bcore').projectDir = new File(settingsDir, 'BlackBox/Bcore')
        include ':Bcore:black-fake'
        project(':Bcore:black-fake').projectDir = new File(settingsDir, 'BlackBox/Bcore/black-fake')
        include ':Bcore:black-hook'
        project(':Bcore:black-hook').projectDir = new File(settingsDir, 'BlackBox/Bcore/black-hook')
        include ':Bcore:pine-core'
        project(':Bcore:pine-core').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-core')
        include ':Bcore:pine-xposed'
        project(':Bcore:pine-xposed').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-xposed')
        include ':Bcore:pine-xposed-res'
        project(':Bcore:pine-xposed-res').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-xposed-res')
        include ':android-mirror'
        project(':android-mirror').projectDir = new File(settingsDir, 'BlackBox/android-mirror')
        include ':black-reflection'
        project(':black-reflection').projectDir = new File(settingsDir, 'BlackBox/black-reflection')
        EOF

    - name: Completely Rewrite Modules for Gradle 7
      run: |
        python3 - << 'EOF'
        import os
        import glob
        import re

        # 1. OVERWRITE app/build.gradle
        with open('app/build.gradle', 'w') as f:
            f.write("""
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.android.system.service'
            compileSdk 33
            defaultConfig {
                applicationId "com.android.system.service"
                minSdk 26
                targetSdk 33
                versionCode 1
                versionName "1.0"
                ndk {
                    abiFilters 'arm64-v8a', 'armeabi-v7a'
                }
            }
            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }
            packagingOptions {
                jniLibs {
                    useLegacyPackaging = true
                }
            }
        }
        dependencies {
            implementation project(':Bcore')
            implementation project(':black-reflection')
            implementation project(':android-mirror')
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
            """)

        # 2. OVERWRITE black-reflection AS JAVA LIBRARY
        br_dir = 'BlackBox/black-reflection'
        if os.path.exists(br_dir):
            with open(os.path.join(br_dir, 'build.gradle'), 'w') as f:
                f.write("""
        plugins {
            id 'java-library'
        }
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
                """)

        # 3. OVERWRITE android-mirror AS JAVA LIBRARY
        am_dir = 'BlackBox/android-mirror'
        if os.path.exists(am_dir):
            with open(os.path.join(am_dir, 'build.gradle'), 'w') as f:
                f.write("""
        plugins {
            id 'java-library'
        }
        dependencies {
            implementation project(':black-reflection')
        }
        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
                """)

        # 4. PATCH REMAINING ANDROID MODULES
        build_files = glob.glob('BlackBox/**/build.gradle', recursive=True)
        for module_gradle in build_files:
            if not os.path.exists(module_gradle) or 'black-reflection' in module_gradle or 'android-mirror' in module_gradle: continue
            
            with open(module_gradle, 'r') as f:
                content = f.read()

            # Force Android Library
            content = content.replace("com.android.application", "com.android.library")
            
            # Remove applicationId
            content = re.sub(r'applicationId\s*["\'][^"\']+["\']', '', content)
            
            # Fix jcenter
            content = content.replace('jcenter()', 'mavenCentral()')
            
            # Replace rootProject.ext variables
            content = content.replace('rootProject.ext.compileSdkVersion', '33')
            content = content.replace('rootProject.ext.buildToolsVersion', '"33.0.0"')
            content = content.replace('rootProject.ext.minSdkVersion', '26')
            content = content.replace('rootProject.ext.targetSdkVersion', '33')
            content = content.replace('rootProject.ext.ndkVersion', '"25.1.8937393"')
            content = content.replace('rootProject.ext.androidXCoreVersion', '"1.9.0"')

            # THE FIX: Use regex to completely nuke the broken string lines
            content = re.sub(r'.*com\.github\.CodingGay\.BlackReflection.*', "api project(':black-reflection')", content)
            content = re.sub(r'.*me\.weishu:free_reflection.*', "api project(':android-mirror')", content)

            # Clean up leftovers
            content = re.sub(r'compileSdkVersion\s+[^=\n]+', 'compileSdkVersion 33', content)
            content = re.sub(r'minSdkVersion\s+[^=\n]+', 'minSdkVersion 26', content)
            content = re.sub(r'targetSdkVersion\s+[^=\n]+', 'targetSdkVersion 33', content)
            content = re.sub(r'buildToolsVersion\s+[^=\n]+', 'buildToolsVersion "33.0.0"', content)

            # Fix Kotlin Plugin
            content = content.replace("id 'kotlin-android'", "id 'org.jetbrains.kotlin.android'")
            content = content.replace("apply plugin: 'kotlin-android'", "apply plugin: 'org.jetbrains.kotlin.android'")

            # Add namespace
            safe_name = os.path.basename(os.path.dirname(module_gradle)).replace('-', '_')
            if safe_name == "BlackBox" or safe_name == "": safe_name = "core"

            if 'android {' not in content:
                content += f"\nandroid {{\n    namespace 'top.niunaijun.{safe_name}'\n    compileSdk 33\n    defaultConfig {{\n        minSdk 26\n        targetSdk 33\n    }}\n    compileOptions {{\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }}\n}}\n"
            elif 'namespace ' not in content:
                content = content.replace('android {', f'android {{\n    namespace "top.niunaijun.{safe_name}"')

            # Create AndroidManifest if missing
            module_dir = os.path.dirname(module_gradle)
            manifest_dir = os.path.join(module_dir, 'src/main')
            manifest_path = os.path.join(manifest_dir, 'AndroidManifest.xml')
            os.makedirs(manifest_dir, exist_ok=True)
            if not os.path.exists(manifest_path):
                with open(manifest_path, 'w') as f:
                    f.write(f'<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="top.niunaijun.{safe_name}" />')

            with open(module_gradle, 'w') as f:
                f.write(content)

        print("All modules patched successfully for Gradle 7.")
        EOF

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle 7.6
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 7.6

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
