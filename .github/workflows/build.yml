name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Force Folder Structure
      run: |
        echo "Extracting..."
        mkdir -p BlackBox_tmp
        unzip -q BlackBox.zip -d BlackBox_tmp
        
        mkdir -p BlackBox
        
        if [ -d "BlackBox_tmp/app" ]; then
            mv BlackBox_tmp/* BlackBox/
        elif [ -d "BlackBox_tmp/BlackBox-2.1.0/app" ]; then
            mv BlackBox_tmp/BlackBox-2.1.0/* BlackBox/
        else
            mv BlackBox_tmp/* BlackBox/
        fi
        rm -rf BlackBox_tmp

    - name: Hardcode Settings Gradle
      run: |
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
            plugins {
                id 'com.android.application' version '8.2.1' apply false
                id 'com.android.library' version '8.2.1' apply false
                id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
            }
        }
        dependencyResolutionManagement {
            repositories {
                google()
                mavenCentral()
                maven { url 'https://jitpack.io' }
            }
        }
        rootProject.name = "TrispyBox"
        include ':app'
        include ':Bcore'
        project(':Bcore').projectDir = new File(settingsDir, 'BlackBox/Bcore')
        include ':Bcore:black-fake'
        project(':Bcore:black-fake').projectDir = new File(settingsDir, 'BlackBox/Bcore/black-fake')
        include ':Bcore:black-hook'
        project(':Bcore:black-hook').projectDir = new File(settingsDir, 'BlackBox/Bcore/black-hook')
        include ':Bcore:pine-core'
        project(':Bcore:pine-core').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-core')
        include ':Bcore:pine-xposed'
        project(':Bcore:pine-xposed').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-xposed')
        include ':Bcore:pine-xposed-res'
        project(':Bcore:pine-xposed-res').projectDir = new File(settingsDir, 'BlackBox/Bcore/pine-xposed-res')
        include ':android-mirror'
        project(':android-mirror').projectDir = new File(settingsDir, 'BlackBox/android-mirror')
        EOF

    - name: Patch Modules & Remove Local BlackReflection
      run: |
        python3 - << 'EOF'
        import os
        import glob
        import re
        import shutil

        # 1. DELETE the local black-reflection module completely
        br_dir = 'BlackBox/black-reflection'
        if os.path.exists(br_dir):
            shutil.rmtree(br_dir)
            print("Deleted local black-reflection folder.")

        # 2. PATCH ALL REMAINING MODULES
        build_files = glob.glob('BlackBox/**/build.gradle', recursive=True)
        for module_gradle in build_files:
            if not os.path.exists(module_gradle): continue
            
            with open(module_gradle, 'r') as f:
                content = f.read()

            # Fix dead jcenter
            content = content.replace('jcenter()', 'mavenCentral()')
            
            # Replace the broken local project link with the exact Maven version 1.3.5
            content = content.replace('rootProject.ext.blackReflection', '1.3.5')
            content = content.replace('$rootProject.ext.blackReflection', '1.3.5')
            content = content.replace('project(\':black-reflection\')', "'com.github.CodingGay.BlackReflection:core:1.3.5'")
            
            # Handle android-mirror specifically (Keep it as a Java library)
            if 'android-mirror' in module_gradle:
                content = content.replace("com.android.library", "java-library")
                content = content.replace("com.android.application", "java-library")
            else:
                # Force everything else to Android Library
                content = content.replace("com.android.application", "com.android.library")
                content = content.replace("apply plugin: 'java-library'", "apply plugin: 'com.android.library'")
                content = content.replace("id 'java-library'", "id 'com.android.library'")

                # Replace rootProject.ext variables
                content = content.replace('rootProject.ext.compileSdkVersion', '34')
                content = content.replace('rootProject.ext.buildToolsVersion', '"34.0.0"')
                content = content.replace('rootProject.ext.minSdkVersion', '26')
                content = content.replace('rootProject.ext.targetSdkVersion', '34')
                content = content.replace('rootProject.ext.ndkVersion', '"25.1.8937393"')
                content = content.replace('rootProject.ext.androidXCoreVersion', '"1.9.0"')

                # Clean up leftovers
                content = re.sub(r'compileSdkVersion\s+[^=\n]+', 'compileSdkVersion 34', content)
                content = re.sub(r'minSdkVersion\s+[^=\n]+', 'minSdkVersion 26', content)
                content = re.sub(r'targetSdkVersion\s+[^=\n]+', 'targetSdkVersion 34', content)
                content = re.sub(r'buildToolsVersion\s+[^=\n]+', 'buildToolsVersion "34.0.0"', content)
                content = re.sub(r'ndkVersion\s+[^=\n]+', 'ndkVersion "25.1.8937393"', content)

                # Fix Kotlin Plugin
                content = content.replace("id 'kotlin-android'", "id 'org.jetbrains.kotlin.android'")
                content = content.replace("apply plugin: 'kotlin-android'", "apply plugin: 'org.jetbrains.kotlin.android'")

                # Add namespace and matchingFallbacks
                safe_name = os.path.basename(os.path.dirname(module_gradle)).replace('-', '_')
                if safe_name == "BlackBox" or safe_name == "": safe_name = "core"

                if 'android {' not in content:
                    content += f"\nandroid {{\n    namespace 'top.niunaijun.{safe_name}'\n    compileSdk 34\n    defaultConfig {{\n        minSdk 26\n        targetSdk 34\n    }}\n    buildTypes {{\n        debug {{ matchingFallbacks = ['debug', 'release'] }}\n        release {{ matchingFallbacks = ['release', 'debug'] }}\n    }}\n    compileOptions {{\n        sourceCompatibility JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n    }}\n}}\n"
                elif 'namespace ' not in content:
                    content = content.replace('android {', f'android {{\n    namespace "top.niunaijun.{safe_name}"')

                if 'matchingFallbacks' not in content and 'buildTypes {' in content:
                    content = content.replace('buildTypes {', "buildTypes {\n        debug { matchingFallbacks = ['debug', 'release'] }\n        release { matchingFallbacks = ['release', 'debug'] }")

                # Create AndroidManifest if missing
                module_dir = os.path.dirname(module_gradle)
                manifest_dir = os.path.join(module_dir, 'src/main')
                manifest_path = os.path.join(manifest_dir, 'AndroidManifest.xml')
                os.makedirs(manifest_dir, exist_ok=True)
                if not os.path.exists(manifest_path):
                    with open(manifest_path, 'w') as f:
                        f.write('<manifest xmlns:android="http://schemas.android.com/apk/res/android" />')

                # Strip package from manifest
                with open(manifest_path, 'r') as f:
                    manifest_content = f.read()
                new_manifest = re.sub(r'\spackage="[^"]*"', '', manifest_content)
                with open(manifest_path, 'w') as f:
                    f.write(new_manifest)

            with open(module_gradle, 'w') as f:
                f.write(content)

        print("All modules patched successfully.")
        EOF

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
