name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip and Force Folder Structure
      run: |
        echo "Extracting..."
        mkdir -p BlackBox_tmp
        unzip -q BlackBox.zip -d BlackBox_tmp
        
        mkdir -p BlackBox
        
        if [ -d "BlackBox_tmp/app" ]; then
            mv BlackBox_tmp/* BlackBox/
        elif [ -d "BlackBox_tmp/BlackBox-2.1.0/app" ]; then
            mv BlackBox_tmp/BlackBox-2.1.0/* BlackBox/
        else
            mv BlackBox_tmp/* BlackBox/
        fi
        rm -rf BlackBox_tmp

    - name: Patch All BlackBox Modules
      run: |
        python3 - << 'EOF'
        import os
        import glob
        import re

        build_files = glob.glob('BlackBox/*/build.gradle')
        build_files.append('BlackBox/build.gradle')

        for module_gradle in build_files:
            if not os.path.exists(module_gradle): continue
            
            print(f"Patching {module_gradle}...")
            with open(module_gradle, 'r') as f:
                content = f.read()

            # 1. Force Library
            content = content.replace("com.android.application", "com.android.library")
            
            # 2. Remove applicationId
            content = re.sub(r'applicationId\s*["\'][^"\']+["\']', '', content)
            
            # 3. Fix jcenter
            content = content.replace('jcenter()', 'mavenCentral()')
            
            # 4. Brutally replace SDK lines
            content = re.sub(r'compileSdkVersion\s+[^=\n]+', 'compileSdkVersion 34', content)
            content = re.sub(r'minSdkVersion\s+[^=\n]+', 'minSdkVersion 26', content)
            content = re.sub(r'targetSdkVersion\s+[^=\n]+', 'targetSdkVersion 34', content)

            # 5. THE FIX: Nuke the entire broken string line for BlackReflection
            # It looks for lines containing "com.github.CodingGay.BlackReflection" and replaces the whole line
            content = re.sub(r'.*com\.github\.CodingGay\.BlackReflection.*', "implementation project(':black-reflection')", content)
            
            # Replace other rootProject.ext variables
            content = content.replace('rootProject.ext.compileSdkVersion', '34')
            content = content.replace('rootProject.ext.minSdkVersion', '26')
            content = content.replace('rootProject.ext.targetSdkVersion', '34')

            # 6. Fix Kotlin Plugin
            content = content.replace("id 'kotlin-android'", "id 'org.jetbrains.kotlin.android'")
            content = content.replace("apply plugin: 'kotlin-android'", "apply plugin: 'org.jetbrains.kotlin.android'")

            # 7. Add namespace if missing
            if 'namespace ' not in content and 'android {' in content:
                module_name = os.path.basename(os.path.dirname(module_gradle))
                content = content.replace('android {', f'android {{\n    namespace "top.niunaijun.{module_name}"')

            with open(module_gradle, 'w') as f:
                f.write(content)

        print("All modules patched successfully.")
        EOF

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
