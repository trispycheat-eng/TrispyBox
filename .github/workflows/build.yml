name: Ultimate Trispy VM Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unzip BlackBox Engine Safely
      run: |
        mkdir -p BlackBox
        unzip -q BlackBox.zip -d BlackBox_tmp
        if [ -f "BlackBox_tmp/build.gradle" ]; then
            mv BlackBox_tmp/* BlackBox/
        else
            # If the zip has a folder inside (e.g. BlackBox-2.1.0)
            FOLDER=$(ls BlackBox_tmp | head -n 1)
            mv BlackBox_tmp/$FOLDER/* BlackBox/
        fi
        rm -rf BlackBox_tmp

    - name: Patch BlackBox Gradle (Python)
      run: |
        python3 - << 'EOF'
        import re
        try:
            with open('BlackBox/build.gradle', 'r') as f:
                content = f.read()

            # 1. Fix dead jcenter
            content = content.replace('jcenter()', 'mavenCentral()')
            
            # 2. Fix ext block variables (compileSdkVersion = 30)
            content = re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 34', content)
            content = re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 34', content)
            content = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', content)
            
            # 3. Fix android block variables (compileSdkVersion 30)
            content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', content)
            content = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', content)
            content = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 26', content)

            # 4. Add namespace if missing (required for AGP 8+)
            if 'namespace ' not in content:
                content = content.replace('android {', 'android {\n    namespace "top.niunaijun.blackbox"')

            with open('BlackBox/build.gradle', 'w') as f:
                f.write(content)
            print("Patched BlackBox build.gradle successfully.")
        except Exception as e:
            print("Patch error:", e)
        EOF
        
        echo "--- Final BlackBox/build.gradle ---"
        head -n 40 BlackBox/build.gradle

    - name: Force AndroidX and Jetifier
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
        echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2.1

    - name: Build with Gradle
      run: |
        echo "Starting build..."
        set +e
        gradle assembleDebug --stacktrace > build.log 2>&1
        EXIT_CODE=$?
        
        if [ $EXIT_CODE -ne 0 ]; then
          echo "====================================================="
          echo "🚨 EXACT ERROR (FILTERED) 🚨"
          echo "====================================================="
          grep -A 25 -m 1 -E "What went wrong:|FAILURE: Build failed" build.log
          echo "====================================================="
          exit 1
        else
          echo "BUILD SUCCESSFUL"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TrispyBox-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
