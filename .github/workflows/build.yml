name: Build Trispy Space

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.2

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

    - name: Show Exact Error
      if: failure()
      run: |
        echo "=============== EXACT ERROR ==============="
        grep -i -E "error:|Caused by:|What went wrong:" build_log.txt -A 5 -B 2

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TrispySpace-APK
        path: app/build/outputs/apk/debug/app-debug.apk
